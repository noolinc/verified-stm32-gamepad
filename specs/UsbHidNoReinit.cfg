\* No scheduler re-init after a bus reset and no keepalive: the state the
\* device already sent before the reset is never re-sent to the new host.
CONSTANTS
    Values = {"p0", "p1"}
    MaxChanges = 2
    MaxResets = 1
    MaxCloses = 2
    ReinitScheduler = FALSE
    Keepalive = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ConfiguredHasAddress DefaultHasNoAddress ReportsOnlyWhenConfigured InflightIsLast DropOnlyWhilePolling
PROPERTIES NoLostChange EventuallyDelivered
CHECK_DEADLOCK FALSE
