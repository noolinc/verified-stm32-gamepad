\* Pure send-on-change (SET_IDLE 0, no keepalive): a report the host
\* discards right after an open is never repeated. TLC must find a
\* behaviour where the held state never arrives.
CONSTANTS
    Values = {"p0", "p1"}
    MaxChanges = 2
    MaxResets = 1
    MaxCloses = 2
    ReinitScheduler = TRUE
    Keepalive = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ConfiguredHasAddress DefaultHasNoAddress ReportsOnlyWhenConfigured InflightIsLast DropOnlyWhilePolling
PROPERTIES NoLostChange EventuallyDelivered
CHECK_DEADLOCK FALSE
